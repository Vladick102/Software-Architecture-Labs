apiVersion: apps/v1
kind: Deployment
metadata:
  name: facade-service
  namespace: bank
  labels:
    app: facade-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: facade-service
  template:
    metadata:
      labels:
        app: facade-service
    spec:
      containers:
        - name: facade-service
          image: facade-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: facade-service
  namespace: bank
spec:
  type: NodePort
  selector:
    app: facade-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
